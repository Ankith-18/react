apiVersion: apps/v1
kind: Deployment

metadata:
  name: react
  labels:
    app: react
    
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
      - name: react
        image: oyank/react:latest
        ports:
        - containerPort: 8080
